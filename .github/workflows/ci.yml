name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-editor-4.6.3
      - run: scripts/fetch-godot.sh
      - run: scripts/run-tests.sh

  build-linux:
    # The executable build downloads ~1 GB of export templates, so it runs on
    # version tags and manual runs only.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-templates-4.6.3
      - run: scripts/fetch-godot.sh --templates
      - run: scripts/export-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: emberdeep-linux-x86_64
          path: build/linux/emberdeep.x86_64
